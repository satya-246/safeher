<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SafeHer — Contacts</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">Safe<span>Her</span></div>
  <div class="nav-links">
    <a href="index.html"    class="nav-link">🏠 <span>Home</span></a>
    <a href="alerts.html"   class="nav-link">🚨 <span>Alerts</span></a>
    <a href="contacts.html" class="nav-link active">👥 <span>Contacts</span></a>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="page-wrap">

  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;animation:fadeUp .6s ease both">
    <div>
      <h1 style="font-size:clamp(1.5rem,3vw,2.2rem)">Emergency <span style="color:var(--rose)">Contacts</span></h1>
      <p class="text-muted" style="margin-top:4px">These people will be notified when you press SOS</p>
    </div>
    <button class="btn btn-primary" onclick="showAddModal()">+ Add Contact</button>
  </div>

  <!-- Contacts list card -->
  <div class="card" style="animation:fadeUp .6s .1s ease both;opacity:0;animation-fill-mode:forwards">
    <div class="card-title">👥 Your Contacts (<span id="contactCount">0</span>)</div>
    <div id="contactsList">
      <div class="empty-state">Loading contacts...</div>
    </div>
  </div>

</div>

<!-- Add Contact Modal -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center;padding:24px">
  <div style="background:var(--card);border:1px solid rgba(232,41,74,.2);border-radius:20px;padding:36px;max-width:400px;width:100%;animation:fadeUp .3s ease">
    <h2 style="font-size:1.4rem;margin-bottom:24px">➕ Add Emergency Contact</h2>
    <div class="field"><label>Contact Name</label><input type="text" id="newName" placeholder="e.g. Mom"/></div>
    <div class="field"><label>Phone Number</label><input type="tel" id="newPhone" placeholder="+91 XXXXX XXXXX"/></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-outline" onclick="closeModal()" style="flex:1;justify-content:center;border-radius:10px">Cancel</button>
      <button class="btn btn-primary" onclick="addContact()" style="flex:1;justify-content:center;border-radius:10px" id="addBtn">Add Contact</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API    = 'safeher-production-e179.up.railway.app';
const userId = localStorage.getItem('userId') || 1;

window.onload = loadContacts;

function loadContacts() {
  fetch(API + '/api/contact/all')
    .then(r => r.json())
    .then(data => {
      document.getElementById('contactCount').textContent = data.length;
      const el = document.getElementById('contactsList');
      if (!data.length) {
        el.innerHTML = `<div class="empty-state">
          No contacts yet.<br>
          <span style="color:var(--rose-lt)">Add your first emergency contact above!</span>
        </div>`;
        return;
      }
      el.innerHTML = data.map(c => `
        <div style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);margin-bottom:10px;transition:background .2s" onmouseover="this.style.background='rgba(232,41,74,.05)'" onmouseout="this.style.background='rgba(255,255,255,.03)'">
          <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-dk));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:900;flex-shrink:0">
            ${c.name[0].toUpperCase()}
          </div>
          <div style="flex:1">
            <div style="font-size:.95rem;font-weight:500">${c.name}</div>
            <div style="font-size:.8rem;color:var(--muted);margin-top:2px">📞 ${c.phone}</div>
          </div>
          <div style="display:flex;gap:8px">
            <a href="tel:${c.phone}" class="btn btn-green btn-sm" style="border-radius:8px;text-decoration:none">📞 Call</a>
            <button class="btn btn-danger btn-sm" style="border-radius:8px" onclick="deleteContact(${c.id})">🗑 Remove</button>
          </div>
        </div>
      `).join('');
    })
    .catch(() => {
      document.getElementById('contactsList').innerHTML = '<div class="empty-state">Cannot connect to server. Is Spring Boot running?</div>';
    });
}

function showAddModal() {
  document.getElementById('newName').value  = '';
  document.getElementById('newPhone').value = '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }

async function addContact() {
  const name  = document.getElementById('newName').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  if (!name || !phone) { showToast('Name and phone are required', 'err'); return; }

  const btn = document.getElementById('addBtn');
  btn.innerHTML = '<span class="spinner"></span>Adding...'; btn.disabled = true;

  try {
    const res  = await fetch(API + '/api/contact/add', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: parseInt(userId), name, phone })
    });
    const data = await res.json();
    if (data && data.id) {
      closeModal();
      showToast('✅ ' + name + ' added as emergency contact!', 'ok');
      loadContacts();
    } else {
      showToast('❌ Failed to add contact', 'err');
    }
  } catch(e) { showToast('❌ Cannot connect to server', 'err'); }
  btn.innerHTML = 'Add Contact'; btn.disabled = false;
}

function deleteContact(id) {
  if (!confirm('Remove this emergency contact?')) return;
  fetch(API + '/api/contact/delete/' + id, { method: 'DELETE' })
    .then(() => { showToast('Contact removed', 'ok'); loadContacts(); })
    .catch(() => showToast('❌ Failed to delete', 'err'));
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

function logout() { localStorage.clear(); window.location.href = 'login.html'; }

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
