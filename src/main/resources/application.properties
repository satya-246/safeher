# ── SafeHer Application Properties ──────────────────────────

# Port — Railway sets PORT automatically
server.port=${PORT:8080}
server.address=0.0.0.0

# ── MySQL Database ────────────────────────────────────────────
# Railway MySQL plugin provides MYSQL_PUBLIC_URL automatically
# Format: mysql://user:password@host:port/database
spring.datasource.url=jdbc:${MYSQl_URL}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── App Name ──────────────────────────────────────────────────
spring.application.name=SafeHer

# ── Telegram ──────────────────────────────────────────────────
telegram.bot.token=${TELEGRAM_BOT_TOKEN:your_token_here}
telegram.chat.id=${TELEGRAM_CHAT_ID:your_chat_id_here}