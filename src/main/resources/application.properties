# ── SafeHer Application Properties ──────────────────────────

# Port
server.port=${PORT:8080}
server.address=0.0.0.0

# ── MySQL — Railway provides these variables automatically ────
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings — fixes HikariCP crash
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── App Name ──────────────────────────────────────────────────
spring.application.name=SafeHer

# ── Telegram (keep as fallback) ───────────────────────────────
telegram.bot.token=${TELEGRAM_BOT_TOKEN:none}
telegram.chat.id=${TELEGRAM_CHAT_ID:none}
