# ── SafeHer Application Properties ──────────────────────────

# Port — Railway sets PORT automatically via environment variable
server.port=${PORT:8080}

# Allow connections from all devices
server.address=0.0.0.0

# ── MySQL Database ────────────────────────────────────────────
# Railway MySQL gives these as environment variables automatically
# When running locally, falls back to your local MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/safeher_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:MAJHI@67}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── App Name ──────────────────────────────────────────────────
spring.application.name=SafeHer

